<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Custos · 运行时日志</title>
  <style>
    :root{--ink:#172033;--muted:#738096;--line:#e5e9f1;--bg:#f5f7fb;--blue:#4865e8;--blue2:#eef2ff;--green:#17785e;--red:#a74444}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1160px)/2))}.brand{font-size:17px;font-weight:750}.nav{display:flex;gap:5px}.nav a{padding:8px 12px;color:#67748a;text-decoration:none;border-radius:8px;font-size:12px}.nav a.active,.nav a:hover{background:var(--blue2);color:var(--blue)}
    main{max-width:1160px;margin:34px auto;padding:0 20px}.eyebrow{color:var(--blue);font-size:11px;font-weight:750;letter-spacing:1px}h1{font-size:27px;margin:5px 0}.lead{color:var(--muted);margin:0 0 22px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px #14274a08}.toolbar{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #eff1f5}.toolbar strong{font-size:13px}.toolbar span,.hint{font-size:11px;color:var(--muted)}.filters{display:flex;align-items:center;gap:8px}.filters select,.filters input{border:1px solid var(--line);border-radius:7px;background:white;padding:7px 9px;font:inherit;font-size:12px}.secondary{border:1px solid #dfe4ed;background:#fff;color:#46546c;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:12px 14px;border-bottom:1px solid #f0f2f6;vertical-align:top}th{font-size:10px;color:#8490a4;background:#fcfcfd;font-weight:700;white-space:nowrap}td{font-size:12px;color:#4f5b70}.tool{font-weight:750;color:var(--ink)}.mono{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#758198;word-break:break-all}.status{display:inline-block;border-radius:99px;padding:3px 7px;font-size:10px;font-weight:700;background:#eaf6f1;color:var(--green)}.status.error{background:#fff0f0;color:var(--red)}details summary{cursor:pointer;color:var(--blue);font-size:11px}pre{white-space:pre-wrap;word-break:break-word;background:#f7f8fb;border-radius:7px;padding:10px;max-width:450px;max-height:260px;overflow:auto;font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.empty{text-align:center;padding:34px;color:#909bad}.count{white-space:nowrap}
    @media(max-width:700px){header{padding:0 10px}.nav a{padding:7px 6px;font-size:10px}main{padding:0 12px;margin-top:22px}.toolbar{align-items:flex-start;flex-direction:column}.filters{width:100%;flex-wrap:wrap}.filters input{flex:1;min-width:130px}}
  </style>
</head>
<body>
  <header><div class="brand">✳ Custos</div><nav class="nav"><a href="/">Skill 管理</a><a href="/secrets-page">环境变量</a><a class="active" href="/runtime-logs-page">运行时日志</a></nav></header>
  <main><div class="eyebrow">RUNTIME ACTIVITY</div><h1>运行时日志</h1><p class="lead">查看 WorkBuddy 通过 MCP 调用 Skill 工具的历史记录。代码和环境变量值不会写入日志。</p>
    <section class="card"><div class="toolbar"><div><strong>工具调用历史</strong><br><span>记录配置获取与代码运行的安全摘要，最新记录在前</span></div><div class="filters"><select id="tool-filter"><option value="">全部工具</option><option value="get_skill_config">get_skill_config</option><option value="run_code">run_code</option></select><input id="skill-filter" placeholder="按 Skill ID 筛选"><button class="secondary" id="refresh">刷新</button></div></div>
      <div class="toolbar" style="border-bottom:0;padding-top:10px;padding-bottom:8px"><span class="count" id="count">读取中…</span><span>最多显示最近 200 条</span></div>
      <div class="table-wrap"><table><thead><tr><th>时间</th><th>工具 / 状态</th><th>Skill</th><th>用户</th><th>耗时</th><th>调用详情</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody></table></div>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let logs=[];
    function render(){const tool=$("tool-filter").value,skill=$("skill-filter").value.trim().toLowerCase(),filtered=logs.filter(x=>(!tool||x.tool_name===tool)&&(!skill||String(x.skill_id||"").toLowerCase().includes(skill)));$("count").textContent=`显示 ${filtered.length} / ${logs.length} 条`;
      $("rows").innerHTML=filtered.length?filtered.map(x=>{const result=x.result_preview||{},input=x.input_snapshot||{},failed=!!result.is_error||result.exit_code!==undefined&&result.exit_code!==0||result.timed_out;const duration=result.duration_ms===undefined?"—":`${esc(result.duration_ms)} ms`;const detail=JSON.stringify({input,result},null,2);return `<tr><td>${esc(new Date(x.timestamp*1000).toLocaleString())}<div class="mono">${esc(x.trace_id)}</div></td><td><div class="tool">${esc(x.tool_name||"未知工具")}</div><span class="status ${failed?"error":""}">${failed?"失败":"成功"}</span></td><td>${esc(x.skill_id||"—")}</td><td>${esc(x.user_id||"—")}</td><td>${duration}</td><td><details><summary>查看安全摘要</summary><pre>${esc(detail)}</pre></details></td></tr>`}).join(""):'<tr><td colspan="6" class="empty">没有符合条件的工具调用记录。记录会在 WorkBuddy 连接 Custos 并调用 MCP 工具后出现。</td></tr>'}
    async function load(){const rows=$("rows");try{const r=await fetch("/runtime-logs"),d=await r.json();if(!r.ok||!d.ok)throw Error(d.msg||"读取日志失败");logs=d.data||[];render()}catch(e){rows.innerHTML=`<tr><td colspan="6" class="empty">${esc(e.message)}</td></tr>`}}
    $("tool-filter").onchange=render;$("skill-filter").oninput=render;$("refresh").onclick=load;load();
  </script>
</body>
</html>
